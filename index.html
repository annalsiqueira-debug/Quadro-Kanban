<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo — Sua agenda em perfeita harmonia</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; background: #f8e9ed; }
  body { font-family: Arial, sans-serif; }
  #frame {
    position: relative; width: 100%; max-width: 1280px;
    margin: 0 auto; aspect-ratio: 16 / 9; overflow: hidden;
    background: #f9e9ed;
    touch-action: none;
  }
  #stage {
    position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
    transform-origin: top left; overflow: hidden;
  }
  .background { position:absolute; inset:0; width:1280px; height:720px; }
  button { font-family: Arial, sans-serif; cursor: pointer; }
  .menu-btn {
    position:absolute; left:480px; width:320px; height:70px;
    border:3px solid #c86482; border-radius:15px;
    background:rgba(255,182,193,.96); color:white;
    font-size:32px; font-weight:bold; box-shadow:0 3px 7px #9c647055;
  }
  .menu-btn:active { transform:scale(.98); }
  #start { top:500px; }
  #exit { top:590px; }
  #back {
    position:absolute; left:20px; top:20px; width:130px; height:45px;
    border:3px solid #c86482; border-radius:15px;
    background:rgba(255,182,193,.96); color:white; font-size:22px; font-weight:bold;
  }
  .image-button { position:absolute; border:0; padding:0; background:transparent; }
  #add { left:20px; top:75px; width:110px; height:110px; }
  #trash { left:1150px; top:20px; width:110px; height:110px; }
  .image-button img { width:100%; height:100%; object-fit:contain; pointer-events:none; }
  .postit {
    position:absolute; width:330px; height:266px; user-select:none;
    touch-action:none;
  }
  .postit > img { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .postit textarea {
    position:absolute; left:10%; top:18%; width:80%; height:64%;
    padding:0; margin:0; border:0; outline:0; resize:none; overflow:auto;
    background:transparent; color:#965064; font:16px/18px "Comic Sans MS", cursive;
    user-select:text; touch-action:pan-y;
  }
  .postit.active { outline:2px solid #ff78a0; outline-offset:-2px; border-radius:8px; }
  .resize-handle {
    display:none; position:absolute; right:5px; bottom:5px; width:20px; height:20px;
    border-radius:4px; background:#ff6496; border:2px solid white; cursor:nwse-resize;
  }
  .postit.active .resize-handle { display:block; }
  .resize-handle:before, .resize-handle:after {
    content:""; position:absolute; background:white;
  }
  .resize-handle:before { width:8px; height:2px; left:4px; bottom:4px; }
  .resize-handle:after { width:2px; height:8px; right:4px; top:4px; }
  #exit-message {
    display:none; position:absolute; left:390px; top:620px; width:500px;
    color:#965064; text-align:center; font-size:17px;
  }
  @media (max-width: 600px) { #frame { width:100%; } }
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <img id="menu-bg" class="background" src="assets/tela_inicial.jpg" alt="">
    <img id="board-bg" class="background" src="assets/quadro_kanban.jpg" alt="" style="display:none">

    <button id="start" class="menu-btn">Iniciar</button>
    <button id="exit" class="menu-btn">Sair</button>
    <div id="exit-message">Você pode fechar esta aba para sair do Memo. ♡</div>

    <button id="back" style="display:none">← Voltar</button>
    <button id="add" class="image-button" style="display:none" title="Adicionar post-it">
      <img src="assets/btn_mais.webp" alt="Adicionar">
    </button>
    <button id="trash" class="image-button" style="display:none" title="Lixeira">
      <img src="assets/lixeira.png" alt="Lixeira">
    </button>
    <div id="notes"></div>
  </div>
</div>

<audio id="music" src="assets/musica_tela_inicial.mp3" loop preload="auto"></audio>
<audio id="menu-sound" src="assets/efeito_botao_tela_inicial.mp3" preload="auto"></audio>
<audio id="board-sound" src="assets/efeito_botoes_quadro.mp3" preload="auto"></audio>

<script>
(() => {
  const frame = document.getElementById('frame');
  const stage = document.getElementById('stage');
  const menuBg = document.getElementById('menu-bg');
  const boardBg = document.getElementById('board-bg');
  const start = document.getElementById('start');
  const exit = document.getElementById('exit');
  const back = document.getElementById('back');
  const add = document.getElementById('add');
  const trash = document.getElementById('trash');
  const notesLayer = document.getElementById('notes');
  const music = document.getElementById('music');
  const menuSound = document.getElementById('menu-sound');
  const boardSound = document.getElementById('board-sound');
  let screen = 'menu', notes = [], active = null, nextId = 1;

  function scaleStage() {
    const scale = frame.clientWidth / 1280;
    stage.style.transform = `scale(${scale})`;
  }
  new ResizeObserver(scaleStage).observe(frame);
  scaleStage();

  function play(audio) {
    if (!audio) return;
    try { audio.currentTime = 0; const p = audio.play(); if (p) p.catch(()=>{}); } catch(e) {}
  }

  function showMenu() {
    screen = 'menu';
    menuBg.style.display = 'block'; boardBg.style.display = 'none';
    start.style.display = 'block'; exit.style.display = 'block';
    back.style.display = add.style.display = trash.style.display = 'none';
    notesLayer.style.display = 'none';
    notes.forEach(n => { n.el.classList.remove('active'); n.textarea.blur(); });
    active = null;
  }
  function showBoard() {
    screen = 'board';
    menuBg.style.display = 'none'; boardBg.style.display = 'block';
    start.style.display = exit.style.display = 'none';
    back.style.display = add.style.display = trash.style.display = 'block';
    notesLayer.style.display = 'block';
    document.getElementById('exit-message').style.display = 'none';
    music.pause();
  }
  start.addEventListener('click', () => { play(menuSound); showBoard(); });
  exit.addEventListener('click', () => {
    play(menuSound);
    document.getElementById('exit-message').style.display = 'block';
  });
  back.addEventListener('click', () => { play(boardSound); showMenu(); });
  add.addEventListener('click', () => {
    play(boardSound);
    const x = 150 + Math.random() * 650;
    const y = 180 + Math.random() * 200;
    createNote(x, y);
  });

  function createNote(x, y) {
    const el = document.createElement('div');
    el.className = 'postit';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    const img = document.createElement('img');
    img.src = 'assets/postit_1.png'; img.alt = '';
    const textarea = document.createElement('textarea');
    textarea.setAttribute('aria-label', 'Texto do post-it');
    textarea.placeholder = '';
    const handle = document.createElement('div');
    handle.className = 'resize-handle';
    el.append(img, textarea, handle);
    notesLayer.appendChild(el);
    const note = { id: nextId++, el, textarea, x, y, width:330, height:266 };
    notes.push(note);
    activate(note);
    attachPointer(note, handle);
  }
  function activate(note) {
    if (active && active !== note) active.el.classList.remove('active');
    active = note;
    note.el.classList.add('active');
    notesLayer.appendChild(note.el);
  }
  function overlaps(a, b) {
    return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
  }
  function attachPointer(note, handle) {
    let mode = null, startX=0, startY=0, origX=0, origY=0, origW=0, moved=false;
    note.el.addEventListener('pointerdown', e => {
      if (screen !== 'board') return;
      e.stopPropagation();
      activate(note);
      startX=e.clientX; startY=e.clientY; origX=note.x; origY=note.y; origW=note.width; moved=false;
      mode = e.target === handle ? 'resize' : 'drag';
      note.el.setPointerCapture(e.pointerId);
    });
    note.el.addEventListener('pointermove', e => {
      if (!mode) return;
      const factor = frame.clientWidth / 1280;
      const dx=(e.clientX-startX)/factor, dy=(e.clientY-startY)/factor;
      if (Math.abs(dx)>4 || Math.abs(dy)>4) moved=true;
      if (mode === 'drag') {
        note.x=origX+dx; note.y=origY+dy;
        note.el.style.left=note.x+'px'; note.el.style.top=note.y+'px';
      } else {
        note.width=Math.max(150,Math.min(600,origW+dx));
        note.height=note.width/(557/448);
        note.el.style.width=note.width+'px'; note.el.style.height=note.height+'px';
      }
    });
    note.el.addEventListener('pointerup', e => {
      if (!mode) return;
      const wasDrag = mode === 'drag';
      mode=null;
      if (wasDrag && !moved && e.target !== handle) {
        note.textarea.focus();
      }
      if (wasDrag) {
        const r=note.el.getBoundingClientRect();
        const t=trash.getBoundingClientRect();
        if (overlaps(r,t)) {
          notes=notes.filter(n=>n!==note); note.el.remove(); active=null; play(boardSound);
        }
      }
    });
    note.el.addEventListener('pointercancel', () => { mode=null; });
  }
  notesLayer.addEventListener('pointerdown', e => {
    if (e.target === notesLayer) {
      notes.forEach(n=>n.el.classList.remove('active'));
      active=null;
    }
  });
  // A primeira interação do usuário libera a música, respeitando o bloqueio de autoplay do navegador.
  document.addEventListener('pointerdown', () => {
    if (screen === 'menu' && music.paused) play(music);
  }, { once:true });
})();
</script>
</body>
</html>
